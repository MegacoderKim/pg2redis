[package]
name = "pg_redis_core"
version = "0.1.0"
edition = "2021"
description = "High-Performance Redis Emulation Layer on PostgreSQL"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg15"]
pg11 = ["pgrx/pg11", "pgrx-tests/pg11"]
pg12 = ["pgrx/pg12", "pgrx-tests/pg12"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg_test = []

[dependencies]
pgrx = "=0.11.4"
redis-protocol = { version = "6.0", features = ["bytes", "resp2", "resp3"] }
tokio = { version = "1.0", features = ["full"] }
bytes = "1.5"
moka = { version = "0.12", default-features = false, features = ["sync"] }
mlua = { version = "0.10", features = ["lua51", "vendored"] }
sha1 = "0.10"
serde_json = "1.0"
rmpv = "1.3"

[dev-dependencies]
pgrx-tests = "=0.11.4"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
